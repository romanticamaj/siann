/* ============================== helpers */
const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const mix=(a,b,t)=>{const A=hex(a),B=hex(b);return `rgb(${A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(',')})`};
const mixHex=(a,b,t)=>{const A=hex(a),B=hex(b);return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('')};
const rgba=(h,a)=>`rgba(${hex(h).join(',')},${a})`;
const fdb=v=>v===null?'−∞':(v>0?'+':v<0?'−':'')+Math.abs(v).toFixed(1);
const fpan=p=>p===0?'C':(p<0?'L':'R')+Math.abs(p);
// audio taper: 0 dB at 75 % of travel, top at +6 dB (Cubase's default Volume Max)
const BP=[[0,-144],[.05,-60],[.15,-40],[.3,-24],[.45,-12],[.6,-6],[.75,0],[1,6]];
const pos=db=>{for(let i=1;i<BP.length;i++){if(db<=BP[i][1]){const[a,x]=BP[i-1],[b,y]=BP[i];return a+(b-a)*(db-x)/(y-x)}}return 1};
const SCALE=[[6,'6'],[0,'0'],[-6,'6'],[-12,'12'],[-24,'24'],[-40,'40'],[-60,'60']];

/* ============================== knob */
function knob(pan,ghost,id){
  const a=p=>(-135+(p+100)/200*270)*Math.PI/180, pt=(ang,r)=>[12+r*Math.sin(ang),12-r*Math.cos(ang)];
  const arc=(p,col,w)=>{const a0=a(0),a1=a(p);const [x0,y0]=pt(Math.min(a0,a1),9.5),[x1,y1]=pt(Math.max(a0,a1),9.5);
    return p===0?'':`<path d="M${x0} ${y0}A9.5 9.5 0 0 1 ${x1} ${y1}" stroke="${col}" stroke-width="${w}" fill="none" stroke-linecap="round"/>`};
  const [bx0,by0]=pt(a(-100),9.5),[bx1,by1]=pt(a(100),9.5);const [nx,ny]=pt(a(pan),6.5),[cx,cy]=pt(a(pan),2.5);
  let g='';
  if(ghost!==undefined){const [gx,gy]=pt(a(ghost),10.5),[hx,hy]=pt(a(ghost),5);g=`<path d="M${hx} ${hy}L${gx} ${gy}" stroke="${AI}" stroke-width="2" stroke-linecap="round"/><circle cx="${gx}" cy="${gy}" r="2" fill="${AI}"/>`}
  return `<svg class="knob" ${id?dp(id):''} viewBox="0 0 24 24"><path d="M${bx0} ${by0}A9.5 9.5 0 1 1 ${bx1} ${by1}" stroke="#07080A" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  ${arc(pan,'#E8EBF1',2)}<circle cx="12" cy="12" r="7" fill="#2A303B" stroke="#000"/><circle cx="12" cy="11.5" r="6.2" fill="url(#kg)"/>
  <path d="M${cx} ${cy}L${nx} ${ny}" stroke="#F2F4F8" stroke-width="1.6" stroke-linecap="round"/>${g}</svg>`;
}

const th=(t,i)=>`

  <div class="col" ${dp('track-'+tk(t,i)+'-colour')}></div><div class="idx" ${dp('track-'+tk(t,i)+'-number')}>${t.ghost?'+':i+1}</div>
  <div class="body">
   <div class="r1">${t.ghost?`<span class="stepn" style="margin-right:3px">1</span>`:''}<span class="name" ${dp('track-'+tk(t,i)+'-name')}>${t.n}</span>
     ${t.ghost?`<span style="color:var(--ai-2);font-size:10.5px;white-space:nowrap">${L('proposed track')}</span>`:`
     <span class="msr m ${t.mute?'on':''} ${t.gUnmute?'ghost':''}" ${dp('track-'+tk(t,i)+'-mute')}>M</span><span class="msr s" ${dp('track-'+tk(t,i)+'-solo')}>S</span><span class="msr r ${t.sel?'on':''}" ${dp('track-'+tk(t,i)+'-record')}><i></i></span><span class="msr rd on" ${dp('track-'+tk(t,i)+'-read')}>R</span><span class="msr" ${dp('track-'+tk(t,i)+'-write')}>W</span>`}
   </div>
   <div class="r2">${t.ghost?`<span>${L('stereo · 0.0 dB · C · no inserts')}</span>`:`
     <span class="db num" ${dp('track-'+tk(t,i)+'-gain')}>${fdb(t.db)} dB</span><span class="pan num" ${dp('track-'+tk(t,i)+'-pan')}>${fpan(t.pan)}</span>
     <span class="hmeter" ${dp('track-'+tk(t,i)+'-meter')}><i style="width:${Math.round(Math.max(t.m[0],t.m[1])*100)}%"></i></span>`}
   </div>
  </div>
 </div>`;

// A MixConsole strip in Cubase's order: (inserts rack) · pan · M S e · fader + meter · level and peak · R W record · name
function strip(t,i){
  const k='strip-'+tk(t,i);
  const y=p=>`${(p*100).toFixed(1)}%`;
  const scale=SCALE.map(([d,l])=>`<span style="bottom:${y(pos(d))}">${l}</span>`).join('');
  const ghostCap=t.gDb!==undefined?`<div class="gline" style="bottom:${y(pos(t.db))};height:${((pos(t.gDb)-pos(t.db))*100).toFixed(1)}%"></div><div class="cap ghost" ${dp(k+'-cap-ghost')} style="bottom:${y(pos(t.gDb))}"></div>`:'';
  const m=t.m.map(v=>`<div class="ch"><i style="height:${(v*100).toFixed(0)}%"></i>${v?`<u style="bottom:${Math.min(98,v*100+7).toFixed(0)}%"></u>`:''}</div>`).join('');
  const ro=t.gDb!==undefined?`<span>${fdb(t.db)}</span><span class="to">→ ${fdb(t.gDb)}</span>`:`<span>${fdb(t.db)}</span><span class="pk">${t.pk===null?'':fdb(t.pk)}</span>`;
  const gainBadge=t.gDb!==undefined?`<span class="stepn" style="right:4px;top:118px">${t.gStep}</span>`:'';
  return `<div class="strip ${t.ghost?'ghost':''} ${t.mute?'muted':''} ${t.sel?'sel':''}" ${dp(k)} style="--c:${t.c}">
   ${gainBadge}
   <div class="ins" ${dp(k+'-inserts')}>${t.ins.map(s=>s==='—'?`<div class="slot empty">+</div>`:`<div class="slot">${s}</div>`).join('')}</div>
   <div class="panrow" ${dp(k+'-pan')}>${t.gPan!==undefined?`<span class="lab" style="display:flex;justify-content:flex-end"><span class="stepn">${t.gStep}</span></span>`:`<span class="lab" style="text-align:right;color:var(--tx-4);font-size:${LANG==='en'?10:10.5}px">${L('PAN')}</span>`}${knob(t.pan,t.gPan,k+'-pan-knob')}<span class="lab" style="${t.gPan!==undefined?'color:var(--ai-2)':''}">${t.gPan!==undefined?fpan(t.gPan):fpan(t.pan)}</span></div>
   <div class="btns" ${dp(k+'-buttons')}>${t.ghost?`<span style="font-size:9.5px;color:var(--ai-2);font-weight:600;letter-spacing:.04em">${L('NEW · STEP 1')}</span>`:
      `${t.gUnmute?`<span class="stepn">${t.gStep}</span>`:''}<span class="msr m ${t.mute?'on':''} ${t.gUnmute?'ghost':''}" ${dp(k+'-mute')}>M</span><span class="msr s" ${dp(k+'-solo')}>S</span>${t.gUnmute?'':`<span class="msr e" ${dp(k+'-edit')}>e</span>`}`}</div>
   <div class="fad" ${dp(k+'-fader-area')}><div class="scale" ${dp(k+'-scale')}>${scale}</div>
     <div class="ftrack" ${dp(k+'-fader')}><div class="unity" style="bottom:${y(pos(0))}"></div>${ghostCap}<div class="cap" ${dp(k+'-cap')} style="bottom:${y(pos(t.db))}"></div></div>
     <div class="meter" ${dp(k+'-meter')}>${m}</div></div>
   <div class="readout" ${dp(k+'-readout')}>${ro}</div>
   <div class="btns" ${dp(k+'-automation')}>${t.ghost?'':`<span class="msr rd on" ${dp(k+'-read')}>R</span><span class="msr" ${dp(k+'-write')}>W</span><span class="msr r ${t.sel?'on':''}" ${dp(k+'-record')}><i></i></span>`}</div>
   <div class="nametag" ${dp(k+'-name')}>${t.n}</div>

/* ============================== event display: one surface (ruler + marker track + lanes + events + ghosts + cursor) */
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function vnoise(seed){const r=rng(seed),v=Array.from({length:512},()=>r());return x=>{const i=Math.floor(x),f=x-i,s=f*f*(3-2*f);return v[i&511]*(1-s)+v[(i+1)&511]*s}}
const N1=vnoise(7),N2=vnoise(99);
function amp(kind,beat,p,r){
  const ph=beat-Math.floor(beat);
  switch(kind){
    case 'kick': return Math.exp(-ph*4.6)*(.8+.2*r)+.02;
    case 'snare':{const b=Math.floor(beat)%4;const g=(b===3&&ph>.74)?Math.exp(-(ph-.75)*22)*.35:0;return (b===1||b===3?Math.exp(-ph*3.6)*(.55+.4*r):.02)+g*r}
    case 'bass':{const e=beat*2,i=Math.floor(e)%8,f=e-Math.floor(e);const on=[1,1,0,1,1,0,1,1][i];return on?(.5+.14*Math.sin(i*1.7))*(1-.45*f)*(.82+.18*r):.02}
    case 'keys':{const f=(beat/2)-Math.floor(beat/2);return (.5*Math.exp(-f*1.6)+.1+.06*N2(beat*3))*(.7+.3*r)}
    case 'vox':{const n=Math.max(0,N1(beat*1.15+p*3)-.34)*1.9;return Math.min(.92,n*(.55+.6*N2(beat*5)))*(.7+.3*r)+.008}
    case 'bgv': return (.2+.3*N1(beat*.6))*(.55+.45*N2(beat*2.5))*(.8+.2*r);
    case 'riser': return Math.pow(p,2.3)*.9*(.65+.35*r)+.01;
    case 'impact': return Math.exp(-p*4.2)*.95*(.6+.4*r);
    case 'pad': return (.16+.3*Math.pow(Math.sin(Math.PI*Math.min(1,p*1.15)),.7))*(.85+.15*r);
  }
  return 0;
}

function draw(){

  const UI=getComputedStyle(document.body).fontFamily;

  const FP=[],FM=[],fp=(id,x,y,w,h)=>FP.push({id,x,y,w,h});
  fp('ruler-upper',0,0,W,RU);fp('ruler-lower',0,RU,W,RULER-RU);fp('marker-track',0,RULER,W,MK);
  T.forEach((t,i)=>fp('lane-'+tk(t,i),0,laneY(i),W,LANE));

  const L0=xb(9),L1=xb(13);

   for(let x=-LANE;x<W;x+=14){g.beginPath();g.moveTo(x,y+LANE);g.lineTo(x+LANE,y);g.stroke()}g.restore()}

  // ruler, upper half: locator band

  g.font='700 8.5px Inter, sans-serif';g.textBaseline='middle';g.fillStyle='#0B0C10';
  g.fillStyle='#C9CED8';g.fillText('L',L0+10,RU/2+2);g.textAlign='right';g.fillText('R',L1-10,RU/2+2);g.textAlign='left';
  g.fillStyle='rgba(255,255,255,.05)';g.fillRect(0,RU,W,1);
  // ruler, lower half: bars and the cursor
  g.fillStyle='#14171D';g.fillRect(0,RU+1,W,RULER-RU-1);
  g.font='500 10px Inter, sans-serif';
  for(let b=1;xb(b)<W;b++){const x=Math.round(xb(b)),maj=(b-1)%4===0;
    g.fillStyle=maj?'#8A93A3':'#3A414D';g.fillRect(x,maj?RU+3:RULER-9,1,maj?RULER-RU-3:9);
    for(let q=1;q<4;q++){g.fillStyle='#2A303B';g.fillRect(Math.round(x+q*PXB/4),RULER-5,1,5)}
    g.fillStyle=maj?'#C9CED8':'#6C7483';g.fillText(String(b),x+4,RU+10)}
  g.fillStyle='#000';g.fillRect(0,RULER-1,W,1);
  // marker track
  g.fillStyle='#101216';g.fillRect(0,RULER,W,MK);g.fillStyle='#000';g.fillRect(0,TOP-1,W,1);
