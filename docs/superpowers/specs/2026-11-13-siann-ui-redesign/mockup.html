<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SIANN — proposed main window (mockup)</title>
<meta name="viewport" content="width=1440">
<!-- Open with ?lang=zh-TW for the Traditional Chinese rendering. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ------------------------------------------------------------------ tokens */
:root{
  --bg-0:#090A0D; --bg-1:#0F1115; --bg-2:#14171D; --bg-3:#1B1F27; --bg-4:#242934; --bg-5:#2E3441;
  --line:#22262F; --line-2:#2F3542; --line-hi:rgba(255,255,255,.045);
  --tx-1:#E8EBF1; --tx-2:#A3ABB9; --tx-3:#6C7483; --tx-4:#474E5B;
  --play:#3DDC84; --rec:#FF4D57; --solo:#FFD23F; --mute:#5AA9FF; --warn:#F5A524; --ok:#3DDC84; --err:#FF5C66;
  /* the agent / proposal colour: used for nothing else */
  --ai:#A78BFF; --ai-2:#C4B3FF; --ai-dim:rgba(167,139,255,.14); --ai-line:rgba(167,139,255,.55);
  /* Latin and digits always come from Inter; Han glyphs from the system font of the locale */
  --font-ui:"Inter","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  --font-num:"JetBrains Mono","Cascadia Mono",ui-monospace,Consolas,monospace;
}
:root:lang(zh-TW){--font-ui:"Inter","PingFang TC","Microsoft JhengHei UI","Microsoft JhengHei","Noto Sans TC","Noto Sans CJK TC",sans-serif}
:root:lang(zh-CN){--font-ui:"Inter","PingFang SC","Microsoft YaHei UI","Microsoft YaHei","Noto Sans SC","Noto Sans CJK SC",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg-0);color:var(--tx-1);overflow:hidden}
body{font:500 12px/1.3 var(--font-ui);-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1,"cv11" 1,"ss01" 1;letter-spacing:.005em}
.num{font-variant-numeric:tabular-nums;letter-spacing:0}
.mono{font-family:var(--font-num);letter-spacing:0}
.up{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--tx-3);font-weight:600}
:lang(zh) .up{font-size:11px;letter-spacing:.04em}
svg.i{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.s{width:14px;height:14px}

/* ------------------------------------------------------------------ shell: left zone | project zone + lower zone | right zone */
.app{width:1440px;height:900px;display:grid;grid-template-columns:216px minmax(0,1fr) 348px;grid-template-rows:48px minmax(0,1fr) 24px;background:var(--bg-0)}
.topbar{grid-column:1/-1;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 10px 0 0;
  background:linear-gradient(#171A21,#12151A);border-bottom:1px solid #000;box-shadow:inset 0 1px 0 var(--line-hi);position:relative;z-index:3}
.leftzone{background:var(--bg-1);border-right:1px solid #000;display:flex;flex-direction:column;min-height:0}
.center{display:grid;grid-template-rows:minmax(0,1fr) 280px;grid-template-columns:minmax(0,1fr);min-width:0;min-height:0;overflow:hidden}
.plans{background:var(--bg-1);border-left:1px solid #000;display:flex;flex-direction:column;min-height:0}
.statusbar{grid-column:1/-1;background:#0C0D11;border-top:1px solid #000;display:flex;align-items:center;gap:14px;padding:0 10px;font-size:11px;color:var(--tx-3)}

/* ------------------------------------------------------------------ top bar */
.tb-left{display:flex;align-items:center;gap:10px;height:100%}
.brand{width:44px;height:100%;display:grid;place-items:center;border-right:1px solid #000}
.brand b{width:22px;height:22px;border-radius:6px;background:conic-gradient(from 210deg,#A78BFF,#5B8FF5,#3FC4DD,#57C98A,#E6C547,#F0675B,#EC6BB0,#A78BFF);display:grid;place-items:center}
.brand b i{width:16px;height:16px;border-radius:4px;background:#12151A;display:grid;place-items:center}
.brand b i::after{content:"";width:2px;height:8px;background:#fff;border-radius:1px;box-shadow:-4px 2px 0 0 rgba(255,255,255,.55),4px 1px 0 0 rgba(255,255,255,.8)}
.session{display:flex;align-items:center;gap:6px;font-weight:600;font-size:13px;padding:5px 4px}
.session svg{color:var(--tx-3)}
.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:11px;background:var(--bg-3);border:1px solid var(--line-2);color:var(--tx-2);font-size:11px}
.iconbtn{width:28px;height:28px;border-radius:5px;display:grid;place-items:center;color:var(--tx-2);border:1px solid transparent}
.iconbtn.on{background:var(--bg-4);color:var(--tx-1);border-color:var(--line-2)}
.iconbtn.dim{color:var(--tx-4)}
.sep{width:1px;height:20px;background:var(--line-2);margin:0 2px}
.transport{display:flex;align-items:center;gap:10px}
.tgroup{display:flex;align-items:center;gap:2px;padding:3px;background:#0B0C10;border:1px solid #000;border-radius:8px;box-shadow:0 1px 0 var(--line-hi)}
.tbtn{width:32px;height:28px;border-radius:5px;display:grid;place-items:center;color:var(--tx-2);background:linear-gradient(#232832,#1B1F27);border:1px solid #2A303B;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.tbtn.play{color:#06210F;background:linear-gradient(#55E896,#2FC873);border-color:#2BB868;box-shadow:0 0 14px rgba(61,220,132,.35),inset 0 1px 0 rgba(255,255,255,.35)}
.tbtn.rec{color:var(--rec)}
.tbtn.lit{color:#0B0C10;background:linear-gradient(#EDEFF4,#C9CED8);border-color:#B8BEC9}
.lcd{display:flex;align-items:stretch;height:36px;background:#07080A;border:1px solid #000;border-radius:8px;box-shadow:inset 0 1px 6px rgba(0,0,0,.8),0 1px 0 var(--line-hi);overflow:hidden}
.lcd .cell{display:flex;flex-direction:column;justify-content:center;padding:0 11px;border-right:1px solid #16191F}
.lcd .cell:last-child{border-right:0}
.lcd .lbl{font-size:8.5px;letter-spacing:.12em;color:var(--tx-4);text-transform:uppercase;font-weight:600;line-height:1}
:lang(zh) .lcd .lbl{font-size:10px;letter-spacing:.02em;line-height:1.05}
.lcd .val{font:500 17px/1.15 var(--font-num);color:#F2F4F8}
.lcd .val.sm{font-size:13px;color:var(--tx-2);line-height:1.4}
.lcd .val em{font-style:normal;color:var(--tx-3)}
.tb-right{display:flex;align-items:center;gap:6px;justify-content:flex-end}
.dsp{display:flex;align-items:center;gap:6px;color:var(--tx-3);font-size:11px;margin-right:2px}
.dsp .bar{width:40px;height:4px;border-radius:2px;background:#07080A;overflow:hidden;border:1px solid #000}
.dsp .bar i{display:block;height:100%;width:22%;background:var(--ok)}
.zones{display:flex;gap:1px;padding:1px;background:#0B0C10;border:1px solid #000;border-radius:6px}
.zones .iconbtn{width:26px;height:24px;border-radius:4px}
.aibtn{display:flex;align-items:center;gap:6px;height:28px;padding:0 10px 0 8px;border-radius:14px;background:var(--ai-dim);border:1px solid var(--ai-line);color:var(--ai-2);font-weight:600;white-space:nowrap}
.aibtn .n{min-width:16px;height:16px;border-radius:8px;background:var(--ai);color:#120B2E;font-size:10px;display:grid;place-items:center;font-weight:700}

/* ------------------------------------------------------------------ left zone: Inspector */
.z-head{height:32px;flex:none;display:flex;align-items:center;gap:8px;padding:0 10px;border-bottom:1px solid #000;background:var(--bg-2);box-shadow:inset 0 1px 0 var(--line-hi);font-weight:600}
.z-head .k{margin-left:auto;font:500 9px var(--font-num);color:var(--tx-4);border:1px solid var(--line-2);border-radius:3px;padding:1px 4px}
.i-track{padding:10px 10px 9px;border-bottom:1px solid #000;display:flex;flex-direction:column;gap:8px;background:#1D212A;box-shadow:inset 3px 0 0 #3FC4DD}
.i-name{display:flex;align-items:center;gap:7px;font-weight:600;font-size:13px}
.i-name small{margin-left:auto;font-weight:500;font-size:10.5px;color:var(--tx-3)}
.i-btns{display:flex;gap:3px}
.i-row{display:grid;grid-template-columns:44px 1fr 46px;align-items:center;gap:8px;font-size:11px;color:var(--tx-3)}
.i-row b{font-weight:600;color:var(--tx-1);text-align:right}
.hs{height:4px;border-radius:2px;background:#07080A;border:1px solid #000;position:relative}
.hs i{position:absolute;left:0;top:0;bottom:0;background:#C9CED8;border-radius:2px}
.hs u{position:absolute;top:-5px;width:8px;height:12px;margin-left:-4px;border-radius:2px;background:linear-gradient(#EEF0F4,#9BA2AF);border:1px solid #000}
.sec{border-bottom:1px solid #000}
.sec-h{height:26px;display:flex;align-items:center;gap:6px;padding:0 8px;background:var(--bg-2);color:var(--tx-2);font-size:11px;font-weight:600}
.sec-h svg{color:var(--tx-4)} .sec-h span{margin-left:auto;color:var(--tx-4);font-weight:500}
.sec.shut .sec-h{color:var(--tx-3)} .sec.shut .sec-h svg{transform:rotate(-90deg)}
.sec-b{padding:7px 8px 9px;display:flex;flex-direction:column;gap:4px}
.irow{display:grid;grid-template-columns:40px 1fr;align-items:center;gap:6px;font-size:11px;color:var(--tx-3)}
.pick{height:22px;border-radius:4px;background:var(--bg-3);border:1px solid var(--line-2);color:var(--tx-1);padding:0 7px;display:flex;align-items:center;justify-content:space-between;font-size:11px}
.pick svg{color:var(--tx-4)}
.islot{height:22px;border-radius:4px;background:var(--bg-4);border:1px solid var(--line-2);padding:0 7px;display:flex;align-items:center;gap:6px;font-size:11px}
.islot::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ok)}
.islot em{margin-left:auto;font-style:normal;color:var(--tx-3);font-weight:700;font-size:10px}
.islot.empty{background:transparent;border-style:dashed;color:var(--tx-4)} .islot.empty::before{display:none}
.hist{font-size:11px;color:var(--tx-2);line-height:1.45;font-weight:400}
.hist b{color:var(--tx-1);font-weight:600} .hist .mono{font-size:10px;color:var(--tx-3)}
.z-foot{margin-top:auto;height:26px;display:flex;border-top:1px solid #000;background:var(--bg-2);font-size:11px;color:var(--tx-3)}
.z-foot span{flex:1;display:grid;place-items:center;position:relative}
.z-foot span.on{color:var(--tx-1)} .z-foot span.on::after{content:"";position:absolute;left:12px;right:12px;top:0;height:2px;background:var(--tx-1)}

/* ------------------------------------------------------------------ project zone */
.arrange{display:grid;grid-template-rows:32px 24px 1fr;min-height:0;background:var(--bg-1);position:relative}
.arrange::after{content:"";position:absolute;inset:0;border:1px solid rgba(232,235,241,.20);pointer-events:none;z-index:4} /* focused zone frame */
.arr-toolbar{display:flex;align-items:center;gap:6px;padding:0 8px;border-bottom:1px solid #000;background:var(--bg-2);box-shadow:inset 0 1px 0 var(--line-hi)}
.seg{display:flex;background:#0B0C10;border:1px solid #000;border-radius:6px;padding:1px;gap:1px}
.seg .b{height:22px;min-width:24px;padding:0 3px;border-radius:4px;display:flex;align-items:center;justify-content:center;gap:2px;color:var(--tx-3);font-size:11px}
.seg .b.on{background:var(--bg-5);color:var(--tx-1);box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.seg .b kbd{font:500 8.5px var(--font-num);color:var(--tx-4)}
.field{display:flex;align-items:center;gap:5px;height:24px;padding:0 7px;border-radius:5px;background:var(--bg-3);border:1px solid var(--line-2);color:var(--tx-2);font-size:11px;white-space:nowrap}
.field.on{color:var(--tx-1)} .field.on svg:first-child{color:var(--solo)}
.field svg:last-child{color:var(--tx-4)} .field em{font-style:normal;color:var(--tx-3)}
.spacer{flex:1}
.overlaypill{display:flex;align-items:center;gap:7px;height:24px;padding:0 3px 0 8px;border-radius:12px;background:var(--ai-dim);border:1px dashed var(--ai-line);color:var(--ai-2);font-size:11px;white-space:nowrap}
.overlaypill b{font-weight:600;color:#fff}
.overlaypill .tog{display:flex;align-items:center;gap:4px;height:18px;padding:0 7px;border-radius:9px;background:var(--ai);color:#120B2E;font-weight:700;font-size:10px}
.infoline{display:flex;align-items:center;gap:0;padding:0 8px;border-bottom:1px solid #000;background:#101216;font-size:11px;color:var(--tx-3);white-space:nowrap}
.infoline .f{display:flex;gap:5px;align-items:baseline;padding:0 8px;border-right:1px solid var(--line)}
.infoline .f:first-child{padding-left:2px} .infoline .f:last-child{border-right:0}
.infoline .f b{color:var(--tx-1);font-weight:500}
.infoline .f i{width:8px;height:8px;border-radius:2px;background:#3FC4DD;align-self:center}

.arr-body{display:grid;grid-template-columns:216px minmax(0,1fr);min-height:0;position:relative}
.headers{border-right:1px solid #000;background:var(--bg-1);z-index:1}
.corner{height:40px;border-bottom:1px solid #000;display:flex;align-items:center;gap:6px;padding:0 8px;background:var(--bg-2)}
.corner .add{display:flex;align-items:center;gap:4px;height:24px;padding:0 8px 0 6px;border-radius:5px;background:var(--bg-4);border:1px solid var(--line-2);color:var(--tx-1);font-size:11px;white-space:nowrap}
.corner .cnt{color:var(--tx-3);font-size:10.5px;margin-left:auto;white-space:nowrap}
.mk{height:20px;border-bottom:1px solid #000;display:flex;align-items:center;gap:6px;padding:0 8px 0 10px;background:#101216;color:var(--tx-3);font-size:10.5px}
.mk svg{width:11px;height:11px}
.th{height:53px;display:grid;grid-template-columns:4px 20px 1fr;border-bottom:1px solid #000;position:relative;background:var(--bg-2)}
.th:nth-child(odd){background:#12151A}
.th .col{background:var(--c)}
.th .idx{display:grid;place-items:center;color:var(--tx-4);font:500 10px var(--font-ui);border-right:1px solid var(--line)}
.th .body{padding:6px 8px 0 8px;display:flex;flex-direction:column;gap:6px;min-width:0}
.th .r1{display:flex;align-items:center;gap:2px}
.th .name{font-weight:600;font-size:12px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th .r2{display:flex;align-items:center;gap:6px;color:var(--tx-3);font-size:10.5px;white-space:nowrap}
.th .r2 .db{color:var(--tx-2);width:50px}
.th .r2 .pan{width:24px}
.msr{width:20px;height:18px;border-radius:3px;display:grid;place-items:center;font:700 10px "Inter",sans-serif;color:var(--tx-3);background:var(--bg-4);border:1px solid #333A47;box-shadow:inset 0 1px 0 rgba(255,255,255,.04);flex:none}
.msr.m.on{background:var(--mute);border-color:#7DBBFF;color:#071A30}
.msr.s.on{background:var(--solo);border-color:#FFE27A;color:#2A2000}
.msr.r.on{background:var(--rec);border-color:#FF8088;color:#2B0508}
.msr.rd.on{background:#3DDC84;border-color:#7BEBAE;color:#052812}
.msr.r i{width:7px;height:7px;border-radius:50%;background:currentColor}
.msr.e{font-style:italic;font-family:Georgia,serif;font-size:11px}
.msr.ghost{outline:1.5px dashed var(--ai);outline-offset:1.5px}
.hmeter{flex:1;height:4px;border-radius:2px;background:#07080A;border:1px solid #000;position:relative;overflow:hidden}
.hmeter i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#2FBF71 0,#3DDC84 62%,#F5D547 82%,#FF5C66 100%);background-size:96px 100%}
.th.muted .name,.th.muted .r2{opacity:.45}
.th.ghost{background:repeating-linear-gradient(135deg,rgba(167,139,255,.10) 0 6px,rgba(167,139,255,.03) 6px 12px),#12151A}
.th.ghost::after{content:"";position:absolute;inset:0;border:1px dashed var(--ai-line);pointer-events:none}
.th.ghost .col{background:var(--ai)} .th.ghost .name{color:var(--ai-2)}
.stepn{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;background:var(--ai);color:#120B2E;font:700 9.5px "Inter",sans-serif;flex:none}
.th.sel{background:#1D212A}
.th.sel::before{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.10);pointer-events:none}
.lanes{position:relative;min-width:0;overflow:hidden;background:var(--bg-0)}
#tl{position:absolute;left:0;top:0}
.hscroll{position:absolute;left:0;right:0;bottom:0;height:8px;background:#0B0C10;border-top:1px solid #000}
.hscroll i{position:absolute;left:2px;top:2px;height:4px;width:52%;border-radius:2px;background:var(--bg-5)}
.hscroll u{position:absolute;right:6px;top:2px;height:4px;width:56px;border-radius:2px;background:var(--bg-4)}
.hscroll u::after{content:"";position:absolute;left:40%;top:-2px;width:8px;height:8px;border-radius:50%;background:#C9CED8}

/* ------------------------------------------------------------------ lower zone: MixConsole */
.lower{display:grid;grid-template-rows:26px 1fr;border-top:1px solid #000;background:var(--bg-1);min-height:0;box-shadow:0 -1px 0 var(--line-hi)}
.tabs{display:flex;align-items:center;gap:2px;padding:0 6px;background:var(--bg-2);border-bottom:1px solid #000;color:var(--tx-3);font-size:11px;white-space:nowrap}
.tab{height:26px;padding:0 10px;display:flex;align-items:center;gap:6px;position:relative}
.tab.on{color:var(--tx-1)} .tab.on::after{content:"";position:absolute;left:8px;right:8px;bottom:0;height:2px;background:var(--tx-1);border-radius:1px}
.tabs kbd{font:500 9px var(--font-num);color:var(--tx-4);border:1px solid var(--line-2);border-radius:3px;padding:0 3px}
.mixer{display:flex;min-width:0;background:var(--bg-0)}
.strip{width:88px;flex:none;border-right:1px solid #000;display:grid;grid-template-rows:34px 28px 22px 1fr 16px 22px 22px;background:var(--bg-2);position:relative}
.strip:nth-child(even){background:#12151A}
.strip.master{width:112px;margin-left:auto;border-left:1px solid #000;border-right:0;background:#181B22}
.ins{padding:3px 4px 0;display:flex;flex-direction:column;gap:2px}
.slot{height:14px;border-radius:3px;background:var(--bg-4);border:1px solid var(--line-2);font-size:9.5px;color:var(--tx-2);padding:0 5px;display:flex;align-items:center;gap:4px;white-space:nowrap;overflow:hidden}
.slot::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--ok);flex:none}
.slot.empty{background:transparent;border-style:dashed;color:var(--tx-4);justify-content:center}.slot.empty::before{display:none}
.panrow{display:flex;align-items:center;justify-content:center;gap:6px;font:500 10px var(--font-ui);color:var(--tx-2);white-space:nowrap}
.panrow .lab{width:26px}
.knob{width:24px;height:24px;position:relative}
.fad{display:grid;grid-template-columns:20px 22px 1fr;gap:2px;padding:4px 6px 2px 4px;min-height:0}
.strip.master .fad{grid-template-columns:22px 26px 1fr}
.scale{position:relative;font:500 8px "Inter",sans-serif;color:var(--tx-4)}
.scale span{position:absolute;right:1px;transform:translateY(50%);line-height:1}
.ftrack{position:relative}
.ftrack::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:4px;margin-left:-2px;border-radius:2px;background:#07080A;border:1px solid #000;box-shadow:0 1px 0 var(--line-hi)}
.ftrack .unity{position:absolute;left:1px;right:1px;height:1px;background:var(--tx-4)}
.cap{position:absolute;left:1px;right:1px;height:24px;margin-bottom:-12px;border-radius:3px;background:linear-gradient(#EEF0F4 0,#C4C9D3 46%,#1A1D24 46%,#1A1D24 54%,#B3B9C4 54%,#8E95A2 100%);border:1px solid #000;box-shadow:0 3px 8px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.7)}
.cap.ghost{z-index:1;background:repeating-linear-gradient(135deg,rgba(167,139,255,.35) 0 3px,rgba(167,139,255,.12) 3px 6px);border:1.5px dashed var(--ai);box-shadow:0 0 12px rgba(167,139,255,.45)}
.gline{position:absolute;left:50%;width:2px;margin-left:-1px;background:var(--ai)}
.meter{display:flex;gap:2px;justify-content:center;position:relative}
.meter .ch{width:6px;position:relative;background:#07080A;border:1px solid #000;border-radius:1.5px;overflow:hidden}
.strip.master .meter .ch{width:9px}
.meter .ch i{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(0deg,#27B565 0,#3DDC84 55%,#F5D547 78%,#FF5C66 96%);background-size:100% 104px;background-position:bottom}
.meter .ch u{position:absolute;left:0;right:0;height:1.5px;background:#F2F4F8}
.readout{display:flex;justify-content:center;gap:5px;font:600 10.5px var(--font-ui);color:var(--tx-1);align-items:center;white-space:nowrap}
.readout .pk{color:var(--tx-4)} .readout .to{color:var(--ai-2)}
.btns{display:flex;justify-content:center;gap:3px;align-items:center;white-space:nowrap}

/* ============================== event display: one surface (ruler + marker track + lanes + events + ghosts + cursor) */
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function vnoise(seed){const r=rng(seed),v=Array.from({length:512},()=>r());return x=>{const i=Math.floor(x),f=x-i,s=f*f*(3-2*f);return v[i&511]*(1-s)+v[(i+1)&511]*s}}
const N1=vnoise(7),N2=vnoise(99);
function amp(kind,beat,p,r){
  const ph=beat-Math.floor(beat);
  switch(kind){
    case 'kick': return Math.exp(-ph*4.6)*(.8+.2*r)+.02;
    case 'snare':{const b=Math.floor(beat)%4;const g=(b===3&&ph>.74)?Math.exp(-(ph-.75)*22)*.35:0;return (b===1||b===3?Math.exp(-ph*3.6)*(.55+.4*r):.02)+g*r}
    case 'bass':{const e=beat*2,i=Math.floor(e)%8,f=e-Math.floor(e);const on=[1,1,0,1,1,0,1,1][i];return on?(.5+.14*Math.sin(i*1.7))*(1-.45*f)*(.82+.18*r):.02}
    case 'keys':{const f=(beat/2)-Math.floor(beat/2);return (.5*Math.exp(-f*1.6)+.1+.06*N2(beat*3))*(.7+.3*r)}
    case 'vox':{const n=Math.max(0,N1(beat*1.15+p*3)-.34)*1.9;return Math.min(.92,n*(.55+.6*N2(beat*5)))*(.7+.3*r)+.008}
    case 'bgv': return (.2+.3*N1(beat*.6))*(.55+.45*N2(beat*2.5))*(.8+.2*r);
    case 'riser': return Math.pow(p,2.3)*.9*(.65+.35*r)+.01;
    case 'impact': return Math.exp(-p*4.2)*.95*(.6+.4*r);
    case 'pad': return (.16+.3*Math.pow(Math.sin(Math.PI*Math.min(1,p*1.15)),.7))*(.85+.15*r);
  }
  return 0;
}

function draw(){
  const host=document.getElementById('lanes'),cv=document.getElementById('tl');
  // Ruler as in Cubase: upper half = locators and cycle, lower half = project cursor (and drag-zoom). Marker track below it.
  const W=host.clientWidth,RU=18,RULER=40,MK=20,TOP=RULER+MK,LANE=53,H=TOP+LANE*T.length,dpr=window.devicePixelRatio||1;
  cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+'px';cv.style.height=H+'px';
  const g=cv.getContext('2d');g.scale(dpr,dpr);
  const UI=getComputedStyle(document.body).fontFamily;
  const PXB=40,xb=b=>(b-1)*PXB,laneY=i=>TOP+i*LANE;

  for(let i=0;i<T.length;i++){g.fillStyle=i%2?'#0D0F13':'#0A0B0E';g.fillRect(0,laneY(i),W,LANE)}
  const L0=xb(9),L1=xb(13);
  g.fillStyle='rgba(255,255,255,.028)';g.fillRect(L0,TOP,L1-L0,H-TOP);            // cycle range tint over the lanes
  for(let b=1;xb(b)<W;b++){
    for(let q=1;q<4;q++){g.fillStyle='rgba(255,255,255,.026)';g.fillRect(Math.round(xb(b)+q*PXB/4),TOP,1,H-TOP)}
    g.fillStyle=(b-1)%4===0?'rgba(255,255,255,.11)':'rgba(255,255,255,.06)';g.fillRect(Math.round(xb(b)),TOP,1,H-TOP);
  }
  for(let i=1;i<=T.length;i++){g.fillStyle='#000';g.fillRect(0,laneY(i)-1,W,1)}
  {const y=laneY(7);g.save();g.beginPath();g.rect(0,y,W,LANE-1);g.clip();g.strokeStyle='rgba(167,139,255,.07)';g.lineWidth=5;
   for(let x=-LANE;x<W;x+=14){g.beginPath();g.moveTo(x,y+LANE);g.lineTo(x+LANE,y);g.stroke()}g.restore()}

  // ruler, upper half: locator band
  g.fillStyle='#0E1014';g.fillRect(0,0,W,RU);
  g.fillStyle='rgba(232,235,241,.20)';g.fillRect(L0,2,L1-L0,RU-3);
  g.fillStyle='#E8EBF1';g.fillRect(L0,2,L1-L0,2);
  g.beginPath();g.moveTo(L0,2);g.lineTo(L0+8,2);g.lineTo(L0,RU-1);g.fill();
  g.beginPath();g.moveTo(L1,2);g.lineTo(L1-8,2);g.lineTo(L1,RU-1);g.fill();
  g.font='700 8.5px Inter, sans-serif';g.textBaseline='middle';g.fillStyle='#0B0C10';
  g.fillStyle='#C9CED8';g.fillText('L',L0+10,RU/2+2);g.textAlign='right';g.fillText('R',L1-10,RU/2+2);g.textAlign='left';
  g.fillStyle='rgba(255,255,255,.05)';g.fillRect(0,RU,W,1);
  // ruler, lower half: bars and the cursor
  g.fillStyle='#14171D';g.fillRect(0,RU+1,W,RULER-RU-1);
  g.font='500 10px Inter, sans-serif';
  for(let b=1;xb(b)<W;b++){const x=Math.round(xb(b)),maj=(b-1)%4===0;
    g.fillStyle=maj?'#8A93A3':'#3A414D';g.fillRect(x,maj?RU+3:RULER-9,1,maj?RULER-RU-3:9);
    for(let q=1;q<4;q++){g.fillStyle='#2A303B';g.fillRect(Math.round(x+q*PXB/4),RULER-5,1,5)}
    g.fillStyle=maj?'#C9CED8':'#6C7483';g.fillText(String(b),x+4,RU+10)}
  g.fillStyle='#000';g.fillRect(0,RULER-1,W,1);
  // marker track
  g.fillStyle='#101216';g.fillRect(0,RULER,W,MK);g.fillStyle='#000';g.fillRect(0,TOP-1,W,1);
  const SEC=[[1,'Intro','#6C7483'],[5,'Verse 1','#57C98A'],[9,'Chorus','#E6C547']];
  g.font='600 10px Inter, sans-serif';
  SEC.forEach(([b,name,c],k)=>{const x=xb(b),x2=k+1<SEC.length?xb(SEC[k+1][0]):xb(17);
    g.fillStyle=rgba(c,.14);g.fillRect(x+1,RULER+2,x2-x-2,MK-5);g.fillStyle=c;g.fillRect(x,RULER+2,2,MK-5);
    g.fillStyle=mix(c,'#FFFFFF',.25);g.fillText((k+1)+'  '+name,x+7,RULER+MK/2)});

  const rr=(x,y,w,h,r)=>{g.beginPath();g.roundRect(x,y,w,h,r)};
  function clip(ti,name,start,len,kind,o={},asGhostAt){
    const t=T[ti],ghost=o.ghost||asGhostAt!==undefined,st=asGhostAt??start;
    const x=xb(st)+1,w=len*PXB-2,y=laneY(ti)+3,h=LANE-7,HDR=13,col=ghost?AI:t.c,dim=t.mute&&!ghost,old=o.moved&&asGhostAt===undefined;
    g.save();
    if(old) g.globalAlpha=.38; else if(dim) g.globalAlpha=.5;
    rr(x,y,w,h,4);g.fillStyle=ghost?'rgba(167,139,255,.10)':mix(col,'#0B0C10',o.sel?.62:.74);g.fill();
    g.save();rr(x,y,w,h,4);g.clip();
    if(ghost){g.strokeStyle='rgba(167,139,255,.16)';g.lineWidth=4;for(let k=-h;k<w;k+=11){g.beginPath();g.moveTo(x+k,y+h);g.lineTo(x+k+h,y);g.stroke()}}
    g.fillStyle=ghost?'rgba(167,139,255,.30)':(o.sel?mix(col,'#FFFFFF',.12):mix(col,'#0B0C10',.12));g.fillRect(x,y,w,HDR);
    const r=rng(ti*977+Math.round(start*13)+kind.length),mid=y+HDR+(h-HDR)/2,half=(h-HDR)/2-2,stp=1/dpr;
    g.fillStyle=ghost?'rgba(196,179,255,.55)':rgba(mixHex(col,'#FFFFFF',o.sel?.28:.12),.5);
    const cols=[];for(let px=0;px<w;px+=stp){const bars=px/PXB,beat=(start-1+bars)*4;const a=Math.min(1,amp(kind,beat,bars/len,r()));cols.push(a);
      const hh=Math.max(.5,a*half);g.fillRect(x+px,mid-hh,stp,hh*2)}
    g.fillStyle=ghost?'rgba(214,202,255,.9)':mixHex(col,'#FFFFFF',o.sel?.45:.25);
    cols.forEach((a,k)=>{const hh=Math.max(.5,a*half*.52);g.fillRect(x+k*stp,mid-hh,stp,hh*2)});
    if(o.sel){const fi=8,fo=22;                                                   // fades, as curves from the upper corners
      g.fillStyle='rgba(9,10,13,.55)';
      g.beginPath();g.moveTo(x,y+HDR);g.lineTo(x+fi,y+HDR);g.quadraticCurveTo(x+1,y+HDR+6,x,y+h);g.fill();
      g.beginPath();g.moveTo(x+w,y+HDR);g.lineTo(x+w-fo,y+HDR);g.quadraticCurveTo(x+w-3,y+HDR+8,x+w,y+h);g.fill();
      g.strokeStyle='#fff';g.lineWidth=1;g.beginPath();g.moveTo(x+fi,y+HDR);g.quadraticCurveTo(x+1,y+HDR+6,x,y+h);g.stroke();
      g.beginPath();g.moveTo(x+w-fo,y+HDR);g.quadraticCurveTo(x+w-3,y+HDR+8,x+w,y+h);g.stroke()}
    g.font='600 10px '+UI;g.textBaseline='middle';
    let tx=x+6;
    if(o.step&&ghost){g.fillStyle=AI;g.beginPath();g.arc(x+8.5,y+6.5,5.2,0,7);g.fill();g.fillStyle='#120B2E';g.font='700 8.5px Inter';g.textAlign='center';g.fillText(String(o.step),x+8.5,y+7);g.textAlign='left';g.font='600 10px '+UI;tx=x+18}
    g.fillStyle=ghost?'#E3DBFF':'#0B0C10';
    if(w>26)g.fillText(name,tx,y+7,w-(tx-x)-6);
    g.restore();
    if(ghost){g.setLineDash([4,3]);g.strokeStyle=AI;g.lineWidth=1.25;rr(x+.5,y+.5,w-1,h-1,4);g.stroke();g.setLineDash([])}
    else if(o.sel){g.strokeStyle='#FFFFFF';g.lineWidth=1.5;rr(x+.25,y+.25,w-.5,h-.5,4);g.stroke();
      // Cubase event handles: fade triangles in the upper corners, resize squares in the lower corners,
      // the volume control at the bottom left, the repeat handle in the middle of the right border
      const fi=8,fo=22;g.fillStyle='#fff';
      g.beginPath();g.moveTo(x+fi-4,y+HDR-1);g.lineTo(x+fi+4,y+HDR-1);g.lineTo(x+fi,y+HDR+5);g.fill();
      g.beginPath();g.moveTo(x+w-fo-4,y+HDR-1);g.lineTo(x+w-fo+4,y+HDR-1);g.lineTo(x+w-fo,y+HDR+5);g.fill();
      g.fillRect(x-1,y+h-6,6,6);g.fillRect(x+w-5,y+h-6,6,6);
      g.beginPath();g.arc(x+w,y+HDR+(h-HDR)/2,3.2,0,7);g.fill();
      g.fillStyle='#0B0C10';rr(x+9,y+h-12,38,10,3);g.fill();g.strokeStyle='rgba(255,255,255,.7)';g.lineWidth=1;rr(x+9.5,y+h-11.5,37,9,3);g.stroke();
      g.fillStyle='#fff';g.font='600 8px Inter';g.fillText('0.0 dB',x+13,y+h-6.5)}
    else{g.strokeStyle='rgba(0,0,0,.55)';g.lineWidth=1;rr(x+.5,y+.5,w-1,h-1,4);g.stroke()}
    g.restore();
  }
  CLIPS.forEach(c=>clip(c[0],c[1],c[2],c[3],c[4],c[5]||{}));
  {const c=CLIPS.find(c=>c[5]&&c[5].moved);clip(c[0],c[1],c[2],c[3],c[4],c[5],c[5].moved);
   const y=laneY(c[0])+LANE-6,x0=xb(c[2])+10,x1=xb(c[5].moved)+10;g.strokeStyle=AI;g.fillStyle=AI;g.lineWidth=1.5;
   g.beginPath();g.moveTo(x0,y);g.lineTo(x1-4,y);g.stroke();g.beginPath();g.moveTo(x1,y);g.lineTo(x1-6,y-3.5);g.lineTo(x1-6,y+3.5);g.fill();
   g.beginPath();g.arc(x0,y,2.2,0,7);g.fill()}

  // project cursor at 10.3.1: its head lives in the lower half of the ruler
  const px=Math.round(xb(10)+2*PXB/4)+.5;
  g.fillStyle='rgba(255,255,255,.07)';g.fillRect(px-3,TOP,6,H-TOP);
  g.strokeStyle='#FFFFFF';g.lineWidth=1;g.beginPath();g.moveTo(px,RU+2);g.lineTo(px,H);g.stroke();
  g.fillStyle='#FFFFFF';g.beginPath();g.moveTo(px-5.5,RU+2);g.lineTo(px+5.5,RU+2);g.lineTo(px+5.5,RU+8);g.lineTo(px,RU+13);g.lineTo(px-5.5,RU+8);g.fill();
}

(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(()=>{draw();document.body.dataset.ready='1'});
</script>
