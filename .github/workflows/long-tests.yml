name: Long tests

# Native tests tagged [long] (hidden from the default ctest run): M2's
# 10-minute recording on the fake device at 4x and the kill at 9 minutes.
# Nightly and on demand; never on pull requests or pushes.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  long:
    name: Long tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S native -B native/build/long -DCMAKE_BUILD_TYPE=Debug -DSIANN_WERROR=ON
      - name: Build
        run: cmake --build native/build/long --config Debug --parallel --target siann_cli_tests
      - name: Long tests
        shell: bash
        run: |
          cd native/build/long/apps/cli
          if [ -d Debug ]; then cd Debug; fi  # multi-config generators (Visual Studio)
          ./siann_cli_tests "[long]" --durations yes
