name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node:
    name: Node bridge (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  native:
    name: Native core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S native -B native/build/ci -DCMAKE_BUILD_TYPE=Debug -DSIANN_WERROR=ON
      - name: Build
        run: cmake --build native/build/ci --config Debug --parallel
      - name: Test
        run: ctest --test-dir native/build/ci -C Debug --output-on-failure

  # Clang RealtimeSanitizer over the whole native suite (realtime, playback,
  # host_fake, cli and the sanitizer canaries). Every audio callback runs in
  # siann::rt::ScopedRealtimeThread, which is the sanitizer's realtime context
  # in this build, so any allocation, lock or blocking call on the audio path
  # fails the job. RTSan needs Clang 20+, which ubuntu-24.04 does not ship;
  # apt.llvm.org provides it. Apple Clang has no RTSan, so macOS is not covered.
  rtsan:
    name: Native core RTSan (ubuntu, Clang 20)
    runs-on: ubuntu-24.04
    env:
      RTSAN_OPTIONS: halt_on_error=1
    steps:
      - uses: actions/checkout@v4
      - name: Install Clang 20 from apt.llvm.org
        run: |
          wget https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh 20
          sudo apt-get install -y libclang-rt-20-dev ninja-build
          clang++-20 --version
      - name: Configure
        run: cmake -S native -B native/build/rtsan -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=clang++-20 -DSIANN_WERROR=ON -DSIANN_RTSAN=ON
      - name: Build
        run: cmake --build native/build/rtsan --parallel
      - name: Test
        run: ctest --test-dir native/build/rtsan --output-on-failure --no-tests=error
      - name: SRC tests through r8brain under RTSan
        run: native/build/rtsan/libs/realtime/siann_realtime_tests "[src]"

  desktop:
    name: Desktop host with JUCE (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install ALSA headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Configure
        run: cmake -S native -B native/build/desktop -DCMAKE_BUILD_TYPE=Debug -DSIANN_WERROR=ON -DSIANN_WITH_JUCE=ON
      - name: Build
        run: cmake --build native/build/desktop --config Debug --parallel
      - name: Test
        run: ctest --test-dir native/build/desktop -C Debug --output-on-failure

  # The Electron shell (m0-electron-shell): the core-only siann-engine target
  # and the Playwright Electron tests in app/ against it. Linux runs Electron
  # under a virtual display; the Chromium sandbox helper needs its setuid bit.
  app:
    name: Electron shell (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Configure
        run: cmake -S native -B native/build/app -DCMAKE_BUILD_TYPE=Debug -DSIANN_WERROR=ON
      - name: Build siann-engine
        run: cmake --build native/build/app --config Debug --parallel --target siann-engine
      - name: Locate siann-engine
        run: |
          exe=$(find native/build/app -type f \( -name siann-engine -o -name siann-engine.exe \) | head -n 1)
          test -n "$exe"
          echo "SIANN_ENGINE_EXE=$GITHUB_WORKSPACE/$exe" >> "$GITHUB_ENV"
      - name: Install app dependencies
        working-directory: app
        run: |
          npm ci
          node node_modules/electron/install.js
      - name: Allow the Chromium sandbox helper
        if: runner.os == 'Linux'
        working-directory: app
        run: |
          sudo chown root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - name: Build app
        working-directory: app
        run: npm run build
      - name: Test (Linux, virtual display)
        if: runner.os == 'Linux'
        working-directory: app
        run: xvfb-run -a npm test
      - name: Test
        if: runner.os != 'Linux'
        working-directory: app
        run: npm test
