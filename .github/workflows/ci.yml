name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Nightly, everything: a pull request runs only the jobs its paths need.
  schedule:
    - cron: '30 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request replaces its run; main keeps every run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# `cmake --build --parallel` with no number means unbounded `make -j` on Linux
# and macOS. With the JUCE build, macOS took an hour over tiny libraries and Linux
# lost its runner three minutes into every build. The variable applies only when
# the build command carries no --parallel flag, so none of the commands below do.
env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4

jobs:
  # Which jobs a pull request needs, from the paths it changes: the table in
  # scripts/check-all.js (`--changed`), the same one agents run locally. Pushes to
  # main, the nightly schedule and manual runs take every job. A plain git diff
  # in a step: no third-party action.
  changes:
    name: Changed paths
    timeout-minutes: 10
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.pick.outputs.native }}
      desktop: ${{ steps.pick.outputs.desktop }}
      app: ${{ steps.pick.outputs.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The pull request's merge commit and its first parent, the base.
          fetch-depth: 2
      - name: Pick the jobs
        id: pick
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            node scripts/check-all.js --changed --base HEAD^1 --plan --json > "$RUNNER_TEMP/plan.json"
          else
            echo '{"steps":["node","native","desktop","app","gcc"],"changed":null}' > "$RUNNER_TEMP/plan.json"
          fi
          cat "$RUNNER_TEMP/plan.json"
          # gcc's CI counterpart is the Linux native job. The desktop job also runs
          # app/'s editor e2e against its JUCE engine, so app/ changes run it too.
          node -e '
            const steps = new Set(require(process.argv[1]).steps);
            const out = {
              native: steps.has("native") || steps.has("gcc"),
              desktop: steps.has("desktop") || steps.has("app"),
              app: steps.has("app"),
            };
            for (const [k, v] of Object.entries(out)) console.log(`${k}=${v}`);
          ' "$RUNNER_TEMP/plan.json" | tee -a "$GITHUB_OUTPUT"

  node:
    name: Node bridge (ubuntu)
    timeout-minutes: 90
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  native:
    name: Native core (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.native == 'true'
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/compiler-cache
        with:
          name: native
      - name: Configure
        run: cmake -S native -B native/build/ci -DCMAKE_BUILD_TYPE=Debug -DSIANN_WERROR=ON
      - name: Build
        run: cmake --build native/build/ci --config Debug
      - name: Test
        run: ctest --test-dir native/build/ci -C Debug --output-on-failure --timeout 300
      - name: Compiler cache statistics
        if: always()
        shell: bash
        run: ccache -s 2>/dev/null || sccache --show-stats 2>/dev/null || true

  # Clang RealtimeSanitizer over the whole native suite (realtime, playback,
  # host_fake, cli and the sanitizer canaries). Every audio callback runs in
  # siann::rt::ScopedRealtimeThread, which is the sanitizer's realtime context
  # in this build, so any allocation, lock or blocking call on the audio path
  # fails the job. RTSan needs Clang 20+, which ubuntu-24.04 does not ship;
  # apt.llvm.org provides it. Apple Clang has no RTSan, so macOS is not covered.
  rtsan:
    name: Native core RTSan (ubuntu, Clang 20)
    needs: changes
    if: needs.changes.outputs.native == 'true'
    timeout-minutes: 90
    runs-on: ubuntu-24.04
    env:
      RTSAN_OPTIONS: halt_on_error=1
    steps:
      - uses: actions/checkout@v4
      - name: Install Clang 20 from apt.llvm.org
        run: |
          wget https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh 20
          sudo apt-get install -y libclang-rt-20-dev ninja-build
          clang++-20 --version
      - uses: ./.github/actions/compiler-cache
        with:
          name: rtsan
      - name: Configure
        run: cmake -S native -B native/build/rtsan -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=clang++-20 -DSIANN_WERROR=ON -DSIANN_RTSAN=ON
      - name: Build
        run: cmake --build native/build/rtsan
      - name: Test
        run: ctest --test-dir native/build/rtsan --output-on-failure --no-tests=error
      - name: SRC tests through r8brain under RTSan
        run: native/build/rtsan/libs/realtime/siann_realtime_tests "[src]"
      - name: Compiler cache statistics
        if: always()
        run: ccache -s || true

  desktop:
    name: Desktop host with JUCE (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    timeout-minutes: 90
    env:
      electron_config_cache: ${{ github.workspace }}/.electron-cache
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install ALSA and JUCE GUI headers
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libxext-dev libxi-dev libxrandr-dev libxinerama-dev
          libxcursor-dev libfreetype-dev libfontconfig1-dev libgl1-mesa-dev xvfb openbox
      # GitHub's archive endpoint answers 504 at times; a cached copy keeps a
      # configure from depending on it. native/cmake/SiannJuce.cmake checks the hash.
      - name: Cache the JUCE archive
        uses: actions/cache@v4
        with:
          path: .juce-archive
          key: juce-be29c81492b6151c8ea8d14c840e1311963b3a83
      - name: Download the JUCE archive
        shell: bash
        run: |
          mkdir -p .juce-archive
          if [ ! -s .juce-archive/juce.tar.gz ]; then
            curl -fL --retry 6 --retry-all-errors --retry-delay 20 -o .juce-archive/juce.tar.gz https://github.com/juce-framework/JUCE/archive/be29c81492b6151c8ea8d14c840e1311963b3a83.tar.gz
          fi
          # Forward slashes on Windows too: CMake reads the path as a URL.
          echo "JUCE_ARCHIVE=$(pwd -W 2>/dev/null || pwd)/.juce-archive/juce.tar.gz" >> "$GITHUB_ENV"
      - uses: ./.github/actions/compiler-cache
        with:
          name: desktop
      - name: Configure
        run: cmake -S native -B native/build/desktop -DCMAKE_BUILD_TYPE=Debug -DSIANN_WERROR=ON -DSIANN_WITH_JUCE=ON -DSIANN_JUCE_ARCHIVE="${{ env.JUCE_ARCHIVE }}"
      - name: Build
        run: cmake --build native/build/desktop --config Debug
      # The hosting tests open plugin editors, so Linux needs a virtual display, and
      # a window manager: without one JUCE's window setup dies on an X BadAtom. The
      # Windows and macOS runners have a desktop session.
      - name: Test (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a sh -c 'openbox & sleep 1; ctest --test-dir native/build/desktop -C Debug --output-on-failure --timeout 300'
      - name: Test
        if: runner.os != 'Linux'
        run: ctest --test-dir native/build/desktop -C Debug --output-on-failure --timeout 300
      # m4-juce-formats: pluginval at strictness 5 on siann_test_plugin. pluginval is
      # GPL and runs as its own process, never linked (spec, Libraries). A pinned
      # release, checked against its hash; scripts/pluginval.js fixes the level.
      - name: Download pluginval
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) zip=pluginval_Windows.zip sum=c08e61ce3b96db41636f8ec7e76f4c7e2c13ebdac7fa1b5a1f52b4f32ec715ab exe=pluginval.exe ;;
            macOS) zip=pluginval_macOS.zip sum=3c4c533bda0c5059eea3ddaea752d757ee2025041f0f47e6bcb0e87f6082b29f exe=pluginval.app/Contents/MacOS/pluginval ;;
            Linux) zip=pluginval_Linux.zip sum=c01c49d8063965c4c2dea8324468336768f5c9139e0b1caebde14c2400b55352 exe=pluginval ;;
          esac
          mkdir -p .pluginval/bin
          curl -fL --retry 6 --retry-all-errors --retry-delay 20 -o ".pluginval/$zip" "https://github.com/Tracktion/pluginval/releases/download/v1.0.4/$zip"
          if command -v sha256sum >/dev/null; then
            echo "$sum  .pluginval/$zip" | sha256sum -c -
          else
            echo "$sum  .pluginval/$zip" | shasum -a 256 -c -
          fi
          unzip -q ".pluginval/$zip" -d .pluginval/bin
          chmod +x ".pluginval/bin/$exe"
          echo "SIANN_PLUGINVAL=$(pwd -W 2>/dev/null || pwd)/.pluginval/bin/$exe" >> "$GITHUB_ENV"
      # The level 5 editor tests need the display the ctest step has.
      - name: pluginval on siann_test_plugin.vst3 (Linux, virtual display)
        if: runner.os == 'Linux'
        run: |
          plugin=$(find native/build/desktop -type d -name siann_test_plugin.vst3 | head -n 1)
          test -n "$plugin"
          xvfb-run -a sh -c 'openbox & sleep 1; node scripts/pluginval.js --strictness-level 5 --output-dir pluginval-logs "$0"' "$plugin"
      - name: pluginval on siann_test_plugin.vst3
        if: runner.os != 'Linux'
        shell: bash
        run: |
          plugin=$(find native/build/desktop -type d -name siann_test_plugin.vst3 | head -n 1)
          test -n "$plugin"
          node scripts/pluginval.js --strictness-level 5 --output-dir pluginval-logs "$plugin"
      # The system lists AUs from its install locations only. The copy is the
      # runner's: the build installs nothing.
      - name: pluginval on siann_test_plugin.component (macOS)
        if: runner.os == 'macOS'
        run: |
          component=$(find native/build/desktop -type d -name siann_test_plugin.component | head -n 1)
          test -n "$component"
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "$component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          node scripts/pluginval.js --strictness-level 5 --output-dir pluginval-logs ~/Library/Audio/Plug-Ins/Components/siann_test_plugin.component
      - name: Keep the pluginval logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pluginval-logs-${{ matrix.os }}
          path: pluginval-logs
          if-no-files-found: ignore
      # m0-plugin-hosting: the editor owned by the real Electron window. Windows
      # alone, as macOS editors float; the app job's engine has no JUCE.
      - uses: actions/setup-node@v4
        if: runner.os == 'Windows'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      # GitHub's release downloads answer 504 at times: keep Electron's zip in the cache.
      - name: Cache the Electron download
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: .electron-cache
          key: electron-${{ runner.os }}-${{ hashFiles('app/package-lock.json') }}
      - name: Editor owned by the Electron window
        if: runner.os == 'Windows'
        shell: bash
        run: |
          exe=$(find native/build/desktop -type f -name siann-engine.exe | head -n 1)
          plugin=$(find native/build/desktop -type d -name siann_test_plugin.vst3 | head -n 1)
          # The CLAP editor case (m5-clap-editor-window): siann_test_plugin's CLAP, a file on Windows.
          clap=$(find native/build/desktop -type f -name siann_test_plugin.clap | head -n 1)
          test -n "$exe" && test -n "$plugin" && test -n "$clap"
          export SIANN_DESKTOP_ENGINE_EXE="$GITHUB_WORKSPACE/$exe" SIANN_TEST_PLUGIN="$GITHUB_WORKSPACE/$plugin"
          export SIANN_TEST_PLUGIN_CLAP="$GITHUB_WORKSPACE/$clap"
          cd app
          # install.js below downloads Electron with retries; npm ci would try once.
          ELECTRON_SKIP_BINARY_DOWNLOAD=1 npm ci
          for i in 1 2 3 4 5; do node node_modules/electron/install.js && break; [ $i = 5 ] && exit 1; sleep 30; done
          npm run build
          npx playwright test editor.spec.ts
      - name: Compiler cache statistics
        if: always()
        shell: bash
        run: ccache -s 2>/dev/null || sccache --show-stats 2>/dev/null || true

  # The Electron shell (m0-electron-shell): the core-only siann-engine target
  # and the Playwright Electron tests in app/ against it. Linux runs Electron
  # under a virtual display; the Chromium sandbox helper needs its setuid bit.
  app:
    name: Electron shell (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.app == 'true'
    timeout-minutes: 90
    env:
      electron_config_cache: ${{ github.workspace }}/.electron-cache
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: ./.github/actions/compiler-cache
        with:
          name: app
      - name: Configure
        run: cmake -S native -B native/build/app -DCMAKE_BUILD_TYPE=Debug -DSIANN_WERROR=ON
      - name: Build siann-engine, siann-cli and the hostile plugin
        run: cmake --build native/build/app --config Debug --target siann-engine siann-cli siann_hostile_plugin_CLAP
      - name: Locate siann-engine, siann-cli and the hostile plugin
        run: |
          exe=$(find native/build/app -type f \( -name siann-engine -o -name siann-engine.exe \) | head -n 1)
          test -n "$exe"
          echo "SIANN_ENGINE_EXE=$GITHUB_WORKSPACE/$exe" >> "$GITHUB_ENV"
          # The timeline e2e (app/test/e2e/timeline.spec.ts) prepares its bundles with siann-cli.
          cli=$(find native/build/app -type f \( -name siann-cli -o -name siann-cli.exe \) | head -n 1)
          test -n "$cli"
          echo "SIANN_CLI_EXE=$GITHUB_WORKSPACE/$cli" >> "$GITHUB_ENV"
          # The crash-recovery e2e (app/test/e2e/crash.spec.ts); a bundle directory on macOS.
          plugin=$(find native/build/app \( -type f -o -type d \) -name siann_hostile_plugin.clap | head -n 1)
          test -n "$plugin"
          echo "SIANN_HOSTILE_PLUGIN_CLAP=$GITHUB_WORKSPACE/$plugin" >> "$GITHUB_ENV"
      # GitHub's release downloads answer 504 at times: keep Electron's zip in the cache.
      - name: Cache the Electron download
        uses: actions/cache@v4
        with:
          path: .electron-cache
          key: electron-${{ runner.os }}-${{ hashFiles('app/package-lock.json') }}
      - name: Install app dependencies
        working-directory: app
        run: |
          # install.js below downloads Electron with retries; npm ci would try once.
          ELECTRON_SKIP_BINARY_DOWNLOAD=1 npm ci
          for i in 1 2 3 4 5; do node node_modules/electron/install.js && break; [ $i = 5 ] && exit 1; sleep 30; done
      - name: Allow the Chromium sandbox helper
        if: runner.os == 'Linux'
        working-directory: app
        run: |
          sudo chown root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      # The plain-tab e2e (app/test/e2e/plain-tab.spec.ts) loads the bundle in
      # Playwright's own Chromium, outside Electron.
      - name: Install Playwright Chromium
        working-directory: app
        run: |
          if [ "$RUNNER_OS" = Linux ]; then npx playwright install --with-deps chromium; else npx playwright install chromium; fi
      - name: Build app
        working-directory: app
        run: npm run build
      - name: Test (Linux, virtual display)
        if: runner.os == 'Linux'
        working-directory: app
        run: xvfb-run -a npm test
      - name: Test
        if: runner.os != 'Linux'
        working-directory: app
        run: npm test

  # The one check to require: passes when every job above passed or was skipped
  # because its paths did not change. A skipped matrix job reports under its
  # unexpanded name, so the per-OS checks cannot be required on their own.
  ci-ok:
    name: CI ok
    if: always()
    needs: [changes, node, native, rtsan, desktop, app]
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "a job ended with $result"; exit 1 ;;
            esac
          done
